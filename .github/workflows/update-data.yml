name: Actualizar datos

on:
  schedule:
    # Horas en UTC (España = UTC+1 en invierno, UTC+2 en verano)
    - cron: "7 5 * * *"          # refresco completo diario (~06:07 en invierno)
    - cron: "*/15 10-22 * * *"   # cada 15 min en franja de partidos (~11:00–23:45 en invierno)
  workflow_dispatch:
    inputs:
      full:
        description: "Forzar refresco completo"
        type: boolean
        default: false

permissions:
  contents: write

# Nunca dos ejecuciones a la vez (evita conflictos al hacer commit)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar datos
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          COMPETITION: ${{ vars.COMPETITION || 'PD' }}
          SEASON: ${{ vars.SEASON || '2026' }}
        run: python -m src.update ${{ inputs.full && '--full' || '' }}

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
